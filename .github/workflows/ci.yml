name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: ECS and PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, fileinfo, gd, iconv, intl, mbstring, pdo_mysql, zip
          coverage: none

      # No composer.lock is committed: this is a library, so it resolves against whatever a
      # site would actually install it with.
      - run: composer update --no-interaction --no-progress --prefer-dist

      - run: composer check-cs

      - run: composer phpstan

      # Fails the build when anything in the resolved tree has a published advisory. Usually
      # that means Craft itself, and usually the fix is on the sites rather than here: the
      # `^5.5.0` constraint already lets them take the patch. Only narrow it here if a
      # vulnerable version would otherwise be chosen.
      - run: composer audit

  tests:
    name: Pest on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # The suite refuses to run against anything but db_test. See tests/bootstrap.php.
          MYSQL_DATABASE: db_test
          MYSQL_USER: db
          MYSQL_PASSWORD: db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # phpunit.xml.dist only supplies these when they are not already set, so the values
      # here win: the runner reaches MySQL on localhost, not on DDEV's `db` host.
      CRAFT_DB_DRIVER: mysql
      CRAFT_DB_SERVER: 127.0.0.1
      CRAFT_DB_PORT: 3306
      CRAFT_DB_DATABASE: db_test
      CRAFT_DB_USER: db
      CRAFT_DB_PASSWORD: db
      CRAFT_DB_TABLE_PREFIX: ''

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, fileinfo, gd, iconv, intl, mbstring, pdo_mysql, zip
          coverage: none

      - run: composer update --no-interaction --no-progress --prefer-dist

      # craft-pest installs Craft against CRAFT_BASE_PATH, which is the repo root, so these
      # have to exist and be writable before the suite boots.
      - run: mkdir -p storage/runtime storage/logs

      - run: vendor/bin/pest
